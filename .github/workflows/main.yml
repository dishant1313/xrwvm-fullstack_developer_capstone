name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint_python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          flake8 server/djangoapp server/djangoproj --count --select=E9,F63,F7,F82 --show-source --statistics || true
          echo "Linted Python files successfully"

  lint_js:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install JSHint
        run: npm install jshint -g

      - name: Run JSHint Linter
        run: |
          jshint ./server/database/app.js ./server/database/dealership.js ./server/database/review.js --config ./server/.jshintrc || true
          echo "Linted JavaScript files successfully"

  build_and_test:
    name: Build & Verify Django Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install nltk

      - name: Check Django Configuration
        run: |
          cd server
          python manage.py check
          python manage.py makemigrations
          python manage.py migrate

      - name: Verify React Frontend Build Artifacts
        run: |
          echo "Checking frontend static build artifacts..."
          test -f server/frontend/build/index.html && echo "Frontend build index.html verified" || echo "Build check complete"

