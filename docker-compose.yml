version: '3.9'

services:
  mongo_db:
    container_name: dealership_mongo
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  dealership_service:
    container_name: dealership_node_api
    build:
      context: ./server/database
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      - MONGO_URL=mongodb://mongo_db:27017/dealershipsDB
    depends_on:
      - mongo_db
    restart: always

  sentiment_service:
    container_name: dealership_sentiment_api
    build:
      context: ./server/djangoapp/microservices
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    restart: always

  django_app:
    container_name: dealership_django
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - backend_url=http://dealership_service:3030
      - sentiment_analyzer_url=http://sentiment_service:5050/
    depends_on:
      - dealership_service
      - sentiment_service
    restart: always

volumes:
  mongo_data: {}

